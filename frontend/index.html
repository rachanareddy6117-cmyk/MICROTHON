<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101821">
    <meta name="description" content="PQC-Migrate cryptographic migration and crypto-agility operations platform">
    <title>PQC-Migrate | Security Operations</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="#" aria-label="PQC-Migrate home">
          <span class="brand-mark"><span></span><span></span><span></span></span>
          <span><strong>PQC<span class="brand-accent">·</span>Migrate</strong><small>SECURITY OPERATIONS</small></span>
        </a>
        <div class="workspace-switcher">
          <span class="workspace-icon" id="workspace-initial">·</span>
          <span class="workspace-name"><strong id="workspace-name">Organization not set up</strong><small id="workspace-subtitle">Local demo workspace</small></span>
          <span class="chevron">⌄</span>
        </div>
        <div class="nav-label">WORKSPACE</div>
        <nav id="primary-nav" aria-label="Main navigation"></nav>
        <div class="sidebar-bottom">
          <div class="posture-card">
            <div class="posture-heading"><span class="pulse-dot"></span> Platform status <span class="status-pill safe">Operational</span></div>
            <div class="posture-copy">API connection <span id="api-status">Checking…</span></div>
            <div class="mini-progress"><span></span></div>
            <small id="last-assessment">No scan recorded</small>
          </div>
          <button class="profile-button" id="profile-button">
            <span class="avatar" id="profile-initial">D</span><span><strong id="profile-name">Demo user</strong><small id="profile-role">Not signed in</small></span><span class="chevron">···</span>
          </button>
        </div>
      </aside>
      <main class="main-area">
        <header class="topbar">
          <button class="icon-button menu-toggle" id="menu-toggle" aria-label="Toggle navigation">☰</button>
          <div class="breadcrumbs"><span>Workspace</span><b>/</b><strong id="breadcrumb-current">Dashboard</strong></div>
          <div class="topbar-actions">
            <span class="environment-badge"><span></span> Demo data</span>
            <button class="icon-button" id="help-button" aria-label="Help">?</button>
            <button class="notification-button" id="notification-button" aria-label="Notifications">♧<i></i></button>
            <span class="topbar-divider"></span>
            <span class="topbar-date" id="topbar-date"></span>
          </div>
        </header>
        <section class="content" id="page-content" tabindex="-1"></section>
      </main>
    </div>
    <div class="toast-region" id="toast-region" aria-live="polite"></div>
    <dialog class="modal" id="action-modal"><form method="dialog"><button class="modal-close" aria-label="Close">×</button><div id="modal-content"></div></form></dialog>
    <script src="/static/app.js" defer></script>
  </body>
</html>

version: '3.9'

services:
  app:
    build: .
    container_name: pqc-migrate-api
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      PQC_DB_URL: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}@postgres:5432/pqc_migrate
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    container_name: pqc-migrate-db
    environment:
      POSTGRES_DB: pqc_migrate
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: pqc-migrate-redis
    ports:
      - "6379:6379"
